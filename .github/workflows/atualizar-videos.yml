name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas
  workflow_dispatch:          # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar vídeos novos no canal
        run: python3 scripts/atualizar_videos.py videos.json
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add videos.json
            git commit -m "Atualizar lista de vídeos do YouTube"
            git push
          fi
